name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: financial_settlement
          POSTGRES_USER: settlement
          POSTGRES_PASSWORD: settlement123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U settlement -d financial_settlement
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Checkstyle
        run: mvn checkstyle:check -B

      - name: PMD
        run: mvn pmd:check -B

      - name: Build and Test
        run: mvn verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/financial_settlement
          SPRING_DATASOURCE_USERNAME: settlement
          SPRING_DATASOURCE_PASSWORD: settlement123
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Docker Build
        run: docker build -t financial-settlement-system .
